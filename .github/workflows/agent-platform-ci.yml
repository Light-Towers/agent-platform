name: agent-platform-ci

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"
      - "agent-core/**"
      - "shared-schemas/**"
      - "deepagents/**"
      - "dialogue-framework/**"
      - "wenda-data-agent/**"
      - "zhanggui-zhiku/**"
      - "kefu-service/**"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"
      - "agent-core/**"
      - "shared-schemas/**"
      - "deepagents/**"
      - "dialogue-framework/**"
      - "wenda-data-agent/**"
      - "zhanggui-zhiku/**"
      - "kefu-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -e ./shared-schemas -e ./agent-core -e ./dialogue-framework -e ./wenda-data-agent -e ./deepagents
      - name: Unit tests
        run: pytest -q
      - name: Ruff lint
        run: ruff check .
      - name: Eval gate (heuristic routing baseline)
        run: python eval/run_eval.py --fail-below 1.0
