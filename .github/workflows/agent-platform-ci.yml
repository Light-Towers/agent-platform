name: agent-platform-ci

# 触发：仅当影响运行/测试/契约/编排的代码变更时跑。
# 布局：packages/（agent-core/agent-runtime/shared-schemas）+ applications/（agent_server 等）
# `web/**` 必须**两个 paths 列表都有**（工单件 §12 第 3 条）：少一处则只改前端的提交
# 不触发 CI，而反证表里「一个只改 web/ 的提交 ⇒ CI 必须跑」那一格会拿到一个
# 「门禁没跑」被当成「门禁放行」的绿——两种绿在账面上长得一模一样。
on:
  push:
    paths:
      - "packages/**"
      - "applications/**"
      - "web/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "scripts/ha_real_kill_verify.py"
      - "scripts/check_doc_sync.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "docker-compose.yml"
      - "docker-compose.ha.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "applications/**"
      - "web/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "scripts/ha_real_kill_verify.py"
      - "scripts/check_doc_sync.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "docker-compose.yml"
      - "docker-compose.ha.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"

# TB-8 分层门禁：
# 本 workflow 只守「轻量确定性门禁」—— lint + 单测 + 启发式路由评测 + 文档同步。
# HA 是重量级基础设施验证，独立为 ha.yml：仅相关变更或手工触发。
# LLM 质量评测依赖外部模型环境，独立为 eval-llm.yml：仅手工触发。
# CI 直接复用 Makefile 的 make ci 单一真相，避免手写命令与本地漂移。
# 最小权限（CodeQL actions/missing-workflow-permissions）：本 workflow 全程只读仓库
# （checkout + make ci + doc sync），无 PR 写 / 无 package 推送 / 无 id-token。
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # 语义缓存契约（ADR-0013 C）必须对真 Valkey 跑：bundle 镜像含 Search 模块。
    # 仅当服务可达时契约用例才执行；CACHE_CONTRACT_REQUIRED=1 保证"没跑"不会静默变绿。
    # tag 真值取自测试机现场读数，不是 git 标签列表：内网主机上跑着的 lf-valkey 就是
    # valkey/valkey-bundle:9.1.2（valkey_version:9.1.1 + search 模块 1.2.1），
    # 且同 tag 在另一台上有 repo digest ⇒ Docker Hub 上确实拉得到。
    # 取证过程与坐标来源见 docs/adr/0013-semantic-cache-single-track.md §9；
    # 三处 pin 由 lint_architecture P14 强制一致。
    services:
      valkey:
        image: valkey/valkey-bundle:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (all workspace packages + dev tools)
        run: make install
      - name: Web gate (pnpm frozen install + tokens 对账 + eslint + vue-tsc + vite build)
        # 故意不用第三方 setup-node/pnpm action：本仓环境取不到 GitHub（公开镜像闸门
        # 关闭，实测 connection refused），拿不到最新主版本号就不能写 `@vN`——凭记忆写
        # 一个版本号入仓是比少一个步骤更贵的东西。runner 自带 node + corepack，
        # corepack 读 web/package.json 的 packageManager 取 pnpm 版本（不在此双写），
        # 机制已于 2026-11-02 在 node:24-alpine 里实跑验证（corepack 0.36.0 → pnpm 10.33.0）。
        # ⚠ 本步在真 runner 上未跑过（本机与内网均不可达 GitHub）——属登记的未验证项，
        #   不是已验证能力；node 版本不够时 engines 那行会在 pnpm install 处报出来。
        run: |
          node --version
          corepack enable
          make ci-web
      - name: CI gate (lint + unit tests + heuristic eval)
        run: make ci
      - name: Semantic cache contract (real Valkey + Search)
        env:
          VALKEY_URL: redis://127.0.0.1:6379/0
          CACHE_CONTRACT_REQUIRED: "1"
        run: make test-cache-contract
      - name: Doc sync check
        run: uv run python scripts/check_doc_sync.py
