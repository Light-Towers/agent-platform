name: agent-platform-ci

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Eval gate (heuristic routing baseline)
        run: python eval/run_eval.py --fail-below 1.0
