name: agent-platform-ci

# 触发：仅当影响运行/测试/契约/编排的代码变更时跑。
on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"
      - "agent-core/**"
      - "shared-schemas/**"
      - "deepagents/**"
      - "dialogue-framework/**"
      - "wenda-data-agent/**"
      - "zhanggui-zhiku/**"
      - "kefu-service/**"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "eval/**"
      - "docs/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/agent-platform-ci.yml"
      - "agent-core/**"
      - "shared-schemas/**"
      - "deepagents/**"
      - "dialogue-framework/**"
      - "wenda-data-agent/**"
      - "zhanggui-zhiku/**"
      - "kefu-service/**"

# TB-8 分层门禁（见 docs/architecture-improvement-plan.md §6.2）：
# 本 workflow 只守「确定性门禁」—— lint + 单测 + 启发式路由评测（无 LLM 依赖，永远可达）。
# LLM 质量评测（依赖 LLM_API_KEY 可达）交由 eval-llm.yml（定时 + 手动），非阻塞、不卡 push。
# CI 直接复用 Makefile 的 `make ci` 单一真相，避免手写命令与本地漂移。
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (all workspace packages + dev tools)
        run: make install
      - name: CI gate (lint + unit tests + heuristic eval)
        run: make ci
