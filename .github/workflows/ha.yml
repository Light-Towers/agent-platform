name: agent-platform-ha

# TB-8 分层门禁 · HA 重型基础设施验证。
# 验证真实 PostgreSQL lease/checkpoint/side_effects 持久化、双进程 kill -9 接管，
# 以及联邦 PG DSN 接线（#146 判据②，这条只有本 workflow 有 PG service 可跑）。
# 默认仅在 HA/Runtime/联邦 DB 相关代码变更时触发；也支持 workflow_dispatch 手工执行。
on:
  push:
    paths:
      - "packages/agent-runtime/**"
      - "packages/agent-core/**"
      - "packages/shared-schemas/**"
      - "tests/ha/**"
      - "applications/agent_federation/agent/db.py"
      - "applications/agent_federation/tests/test_db_integration.py"
      - "scripts/ha_real_kill_verify.py"
      - "docker-compose.ha.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/ha.yml"
  pull_request:
    paths:
      - "packages/agent-runtime/**"
      - "packages/agent-core/**"
      - "packages/shared-schemas/**"
      - "tests/ha/**"
      - "applications/agent_federation/agent/db.py"
      - "applications/agent_federation/tests/test_db_integration.py"
      - "scripts/ha_real_kill_verify.py"
      - "docker-compose.ha.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/ha.yml"
  workflow_dispatch:

# 最小权限（CodeQL actions/missing-workflow-permissions）：checkout + 起 postgres service
# + 跑 HA 测试，全程只读仓库。
permissions:
  contents: read

jobs:
  ha:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_platform_dev
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_PLATFORM_PG_URL: postgresql://agent:agent_platform_dev@localhost:5432/agent_platform
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (all workspace packages + dev tools)
        run: make install
      - name: HA tests (requires_pg marker, real PostgreSQL)
        run: uv run pytest tests/ha -m requires_pg -q
      # #146 判据②：DSN 接线不是"传了参数"，要真的建池并跑通 typed memory。
      # 放在本 workflow 而非普通 CI：只有这里有 PG service 与 AGENT_PLATFORM_PG_URL。
      - name: Federation PG DSN wiring (#146, real PostgreSQL)
        run: uv run pytest applications/agent_federation/tests/test_db_integration.py -q
      - name: HA real kill -9 takeover (dual-process, real PG)
        run: uv run python scripts/ha_real_kill_verify.py
