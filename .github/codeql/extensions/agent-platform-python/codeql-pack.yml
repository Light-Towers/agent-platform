# CodeQL 模型包（data extensions）——本仓自研安全边界的流建模
#
# 为什么需要：agent_core.guardrails.fs 是本平台的**唯一**路径校验出口（P7-1 不变量要求
# 所有路径出入过内核 guardrails）。CodeQL 不分析跨包函数体，因此不认识这些 helper 是
# sanitizer，于是把「helper 的返回值喂给文件 sink」继续报成 py/path-injection。
# 补模型包是官方推荐解法；若在调用点内联复检，等于破 P7-1 的旁路。
#
# 加载方式：置于 .github/codeql/extensions/ 下，default setup 与 advanced setup 均自动识别，
# 无需发布到 Container registry，也无需切换配置模式。
name: light-towers/agent-platform-python-models
version: 0.0.1
# 模型包必须是 library 包且**不得有依赖**（官方约束）
library: true
extensionTargets:
  codeql/python-all: "*"
dataExtensions:
  - models/**/*.yml
