# KS Milvus（向量库，standalone）—— Deployment + hostPath + Service
# 依赖 etcd / minio：用 initContainer（etcd 镜像自带 etcdctl + sh）等两者就绪再启动。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks-milvus
  namespace: agent-platform
  labels:
    app: ks-milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ks-milvus
  template:
    metadata:
      labels:
        app: ks-milvus
    spec:
      nodeSelector:
        kubernetes.io/hostname: ambari03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-etcd-minio
          image: quay.io/coreos/etcd:v3.5.18
          command:
            - sh
            - -c
            - "until etcdctl --endpoints=etcd:2379 endpoint health && (echo > /dev/tcp/minio/9000); do echo waiting; sleep 2; done"
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.5.10
          command: ["milvus", "run", "standalone"]
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
            - name: MINIO_ADDRESS
              value: "minio:9000"
            - name: MINIO_REGION
              value: "us-east-1"
            - name: MINIO_BUCKET_NAME
              value: "a-bucket"
            - name: MQ_TYPE
              value: "default"
          ports:
            - containerPort: 19530
            - containerPort: 9091
          volumeMounts:
            - name: milvus-data
              mountPath: /var/lib/milvus
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "4.0"
              memory: 4G
      volumes:
        - name: milvus-data
          hostPath:
            path: /data/k8s-demo/knowledge-service/milvus
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: ks-milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
    - name: health
      port: 9091
      targetPort: 9091
