# KS（knowledge-service）非敏感配置
# 与 docker-compose 的 .env 对齐；密字段（token / password / access_key）在 41-ks-secret（集群内创建，不入库）。
# 注意：本集群无 StorageClass，stateful 组件走 hostPath 钉 <internal-node-03>(<internal-host-126>)，与 10-postgres.yaml 同范式。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ks-config
  namespace: agent-platform
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  CORS_ORIGINS: "*"
  CORS_ALLOW_CREDENTIALS: "True"
  # Milvus 地址（.env 未含，compose environment 提供；k8s 用 Service 名 milvus 解析）
  MILVUS_URL: "http://milvus:19530"
  MINERU_BASE_URL: "https://mineru.net/api/v4"
  EMBEDDING_MODE: "api"
  RERANK_MODE: "api"
  SILICONFLOW_BASE_URL: "https://api.siliconflow.cn/v1"
  SILICONFLOW_EMBEDDING_MODEL: "BAAI/bge-m3"
  SILICONFLOW_RERANK_MODEL: "BAAI/bge-reranker-v2-m3"
  OPENAI_BASE_URL: "https://api.siliconflow.cn/v1"
  LLM_DEFAULT_MODEL: "Qwen/Qwen2.5-7B-Instruct"
  LLM_DEFAULT_TEMPERATURE: "0.7"
  ITEM_NAME_DIAG: "0"
  BGE_M3: "BAAI/bge-m3"
  BGE_DEVICE: "cpu"
  BGE_FP16: "0"
  EMBEDDING_DIM: "1024"
  MILVUS_COLLECTION_PREFIX: "product_manual"
  MILVUS_SCHEMA_VERSION: "v1"
  CHUNK_VERSION: "v1-title-aware"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_DATABASE: "neo4j"
  NEO4J_USERNAME: "neo4j"
  MONGO_URL: "mongodb://mongo:27017"
  MONGO_DB_NAME: "knowledge-service"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET_NAME: "kb-import-bucket"
  MINIO_IMG_DIR: "images"
  MINIO_SECURE: "False"
  MINIO_PDF_DIR: "pdf_files"
  BGE_RERANKER_DEVICE: "cpu"
  BGE_RERANKER_FP16: "0"
  MODELS_DIR: "./models"
  MD_ROOT_DIR: "./temp-files"
  MINERU_MODEL_SOURCE: "modelscope"
  MODELSCOPE_OFFLINE: "1"
  LOG_CONSOLE_ENABLE: "True"
  LOG_FILE_ENABLE: "True"
  LOG_CONSOLE_LEVEL: "INFO"
  LOG_FILE_LEVEL: "INFO"
  LOG_FILE_RETENTION: "7 days"
  KNOWLEDGE_SERVICE_NAME: "knowledge-service"
  KNOWLEDGE_TRACE_ENABLED: "false"
  KNOWLEDGE_RATE_LIMIT_PER_CLIENT: "20"
  KNOWLEDGE_RATE_LIMIT_GLOBAL: "500"
  KNOWLEDGE_RATE_LIMIT_WINDOW_S: "60"
  KNOWLEDGE_MAX_HISTORY_ROUNDS: "20"
  KNOWLEDGE_MAX_BODY_BYTES: "104857600"
  KNOWLEDGE_DEFAULT_TENANT_ID: "exhibition"
