# KS etcd（milvus 元数据存储）—— Deployment + hostPath + Service
# 钉 ambari03(126)，hostPath 复用该机磁盘，与 10-postgres.yaml 同范式。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks-etcd
  namespace: agent-platform
  labels:
    app: ks-etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ks-etcd
  template:
    metadata:
      labels:
        app: ks-etcd
    spec:
      nodeSelector:
        kubernetes.io/hostname: ambari03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.18
          command:
            - etcd
            - -advertise-client-urls=http://etcd:2379
            - -listen-client-urls=http://0.0.0.0:2379
            - --data-dir=/etcd
          env:
            - name: ETCD_AUTO_COMPACTION_MODE
              value: revision
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1000"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "4294967296"
            - name: ETCD_SNAPSHOT_COUNT
              value: "50000"
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "1.0"
              memory: 1G
      volumes:
        - name: etcd-data
          hostPath:
            path: /data/k8s-demo/knowledge-service/etcd
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: ks-etcd
  ports:
    - port: 2379
      targetPort: 2379
