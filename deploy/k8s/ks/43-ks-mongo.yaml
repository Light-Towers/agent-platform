# KS Mongo（历史会话）—— Deployment + hostPath + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks-mongo
  namespace: agent-platform
  labels:
    app: ks-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ks-mongo
  template:
    metadata:
      labels:
        app: ks-mongo
    spec:
      nodeSelector:
        kubernetes.io/hostname: ambari03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mongo
          image: mongo:7
          env:
            - name: MONGO_INITDB_DATABASE
              value: "knowledge-service"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1.0"
              memory: 1G
      volumes:
        - name: mongo-data
          hostPath:
            path: /data/k8s-demo/knowledge-service/mongo
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: ks-mongo
  ports:
    - port: 27017
      targetPort: 27017
