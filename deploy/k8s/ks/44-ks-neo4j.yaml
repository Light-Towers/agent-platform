# KS Neo4j（知识图谱）—— Deployment + hostPath + Service
# 凭据 NEO4J_AUTH 来自 Secret ks-secrets（NEO4J_AUTH = neo4j:<password>）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks-neo4j
  namespace: agent-platform
  labels:
    app: ks-neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ks-neo4j
  template:
    metadata:
      labels:
        app: ks-neo4j
    spec:
      nodeSelector:
        kubernetes.io/hostname: ambari03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: neo4j
          image: neo4j:5
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: ks-secrets
                  key: NEO4J_AUTH
          ports:
            - containerPort: 7687
            - containerPort: 7474
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1.0"
              memory: 1G
      volumes:
        - name: neo4j-data
          hostPath:
            path: /data/k8s-demo/knowledge-service/neo4j
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: agent-platform
spec:
  type: ClusterIP
  selector:
    app: ks-neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
