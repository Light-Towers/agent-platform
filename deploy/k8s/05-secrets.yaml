# demo/本地集群用的 Secret 对象（口令与 DATABASE_URL 都是开发值）。
#
# ⚠ 126（以及任何真实环境）不要 apply 本文件，两个原因：
#   1) stringData 是整体覆盖，不是按键合并 —— 会把线上 Secret 换成这里的 demo 值，
#      应用当场连不上库；
#      ⚠ 补键也因此别用 `kubectl create secret ... --dry-run=client | kubectl apply -f -`：
#      apply 对 Secret 的多键 stringData 同样是**整对象替换**，会抹掉同对象里已有键
#      （真实环境补这两个 DSN 用 `kubectl patch secret`，patch 体是
#      '{"stringData":{...}}' 合并写，见 deploy/k8s/README.md §6.2）；
#   2) 线上真实凭据不住在这个对象里：模型密钥与入站密钥在集群单独建的
#      `observability-keys`（见 deploy/k8s/README.md §6.1），真实密钥永不入库。
# 本文件与 00-config.yaml 分开存放是刻意的：让人常 apply 的那份配置里，
# 从构造上就不可能带 Secret 对象（"记得别一起 apply"是约定，不是保证）。
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-secrets
  namespace: agent-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "agent_platform_dev"
  # 与 compose 的 DATABASE_URL 同构：user=agent / db=agent_platform / svc 名 postgres
  DATABASE_URL: "postgresql://agent:agent_platform_dev@postgres:5432/agent_platform"
  # 语义缓存（ADR-0013 C）：demo 集群无口令，服务名 valkey（15-valkey.yaml）。
  # 真实环境必须由运维单独创建该键，且口令只存在于 Secret；
  # 应用侧日志/health 会脱敏，但仓库内绝不落真实口令。
  VALKEY_URL: "redis://valkey:6379/0"
  # ---- 问数数据面（批次 2）：三库三角色里的两个服务 DSN，与 DATABASE_URL 不同库不同角色 ----
  # 口令的**唯一来源就是这两个 DSN**：deploy/data/nl2sql_dbsql.sql 从 DSN 解析 user/password
  # 来建角色、并在每次重跑时 ALTER ROLE 同步。不再单设 *_PASSWORD 键——两处各写一份，
  # 轮换必漏改其一，线上表现是"服务连不上库"（最难查的那种形状）。
  # ⚠ 只改这里的口令不会让库里的角色跟着变：必须重跑 deploy/k8s/35-nl2sql-dbsql-job.yaml
  #   （它才执行 ALTER ROLE ... PASSWORD）。改完 Secret 不重跑 Job = 新口令对上旧角色。
  # 角色名与库名是清单里的固定值（Job 会对账，不匹配即非零中止；psql 脚本错误退码是 3）：
  #   nl2sql_meta@nl2sql_meta（元知识库，LOGIN + db owner，在线路径要写它）
  #   nl2sql_dw_reader@nl2sql_dw（业务样例数仓，LOGIN，**只有 GRANT SELECT** = L1）
  # 建它们的是同集群超级用户 DATABASE_URL，见 35 Job；dw 的 owner 是 NOLOGIN 组角色
  # nl2sql_dw_owner（服务从不以它连接）。
  META_DB_DSN: "postgresql://nl2sql_meta:nl2sql_meta_dev@postgres:5432/nl2sql_meta"
  DW_DB_DSN: "postgresql://nl2sql_dw_reader:nl2sql_dw_reader_dev@postgres:5432/nl2sql_dw"
