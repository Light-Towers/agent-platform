# agent-platform API：Deployment + Service
# 镜像构建见 README 步骤 2（minikube image build -t agent-platform:dev .）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform
  namespace: agent-platform
  labels:
    app: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-platform
  template:
    metadata:
      labels:
        app: agent-platform
    spec:
      # 137 定性：外部依赖断连（postgres DNS + OTLP no route）让优雅关闭卡在「等后台任务」，
      # 超过默认 30s 宽限期被 SIGKILL。放宽只买到时间，根因在集群网络，别当成修复。
      terminationGracePeriodSeconds: 60
      # 密钥卷要 group 可读（与 30 同一档）：本 Pod 的两个卷里只有 secret 那个受 fsGroup 管，
      # hostPath 权重缓存不受影响（2026-10-28 在 126 实跑探针量过：宿主目录前后 stat 不变）。
      # 完整的实测读数写在 30 头部，不在这里抄第二份数字。
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent-platform
          image: agent-platform:dev
          imagePullPolicy: IfNotPresent   # 本地构建镜像，不拉远端
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: DATABASE_URL
            # ---- 问数（Text-to-SQL）的数据面：从「连接串」换成「服务地址」----
            # 这里此前注的是 SQL_DSN（复用上面 DATABASE_URL 的值）。那条路已退役（ADR-0011 选项 A），
            # 平台侧只剩瘦客户端：经集群内 HTTP 调 nl2sql-service（生成+执行+取值核验都在那边）。
            # 摘它不是「清理无用变量」，是**拆掉一盏假灯**：SQL_DSN 还在注入的那几轮里，/health 拿
            # detect_dialect(settings.sql_dsn) 报 sql_backend=postgres，而那个 postgres 指的是**平台库**，
            # 与问数真正用的业务库（nl2sql_dw，dw_reader 只读角色）不是一个东西 ⇒ 灯亮不等于问数能用。
            # 批次 5（2026-10-28）已把灯与字段一并退役：config.py 不再有 sql_dsn/sql_max_rows，根
            # .env.example 与 compose 的对应键同批删除 ⇒ 现在注回来只会被 env 死键门禁判红。
            - name: NL2SQL_SERVICE_URL
              value: "http://nl2sql-service:8000"
            # ---- 模型凭据 + 入站凭据：只引用键名，真实值永不入库 ----
            # 这两个键在 126 上属集群单独持有的 `observability-keys`（对象名早于鉴权用途，
            # 见 VERIFICATION.md §C 的 create secret 记录）；缺键时 Pod 以
            # CreateContainerConfigError 起不来，是有意的 fail-closed：
            # 宁可拒绝启动，也不要静默回退到无密钥 / 错误模型地址。
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: observability-keys
                  key: LLM_API_KEY
            # API_KEY 非空才启用 X-API-Key 校验，且客户端 thread_id 被忽略、会话归到服务端断言的租户桶。
            # DEPLOY_ENFORCE_IDENTITY=true 时：无验签公钥且无 SINGLE_TENANT → 启动即失败。
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: observability-keys
                  key: API_KEY
            - name: SINGLE_TENANT
              value: "default"
            - name: DEPLOY_ENFORCE_IDENTITY
              value: "true"
            # 内部签名头的**签发侧**：/sql/train 转发 nl2sql /api/meta/ingest 时用它签 X-Internal-Tenant。
            # 只认文件不认 env（agent_core/internal_header.py:load_hmac_key 读 INTERNAL_HMAC_KEY_FILE 指向的文件），
            # 所以这里给的是挂载路径，不是密钥值。密钥与 30（验签侧）同源：observability-keys/INTERNAL_HMAC_KEY。
            # 两侧不同值的当场表现是 /sql/train 全线 401 而 /health 全绿（探针不碰鉴权）⇒ 形状一致性
            # 由 tests/deploy 钉住，能不能真读到由批次 6 的写路径取证钉。
            - name: INTERNAL_HMAC_KEY_FILE
              value: /run/app-secrets/internal_hmac.key
            # ---- 登录面（PR-2c：签发 + 验签走同一条 identity 通路，方案 §5）----
            # 两个 *_FILE 给的是**挂载路径**不是密钥值：identity.load_private_key /
            # load_public_keys 只读 env 指向的文件（os.getenv 那一句就是清单与代码的唯一接口）。
            # 真实密钥永不在清单里：值住集群自建的 Secret agent-platform-jwt，生成与注入见
            # deploy/k8s/README.md §6.3。
            # ⚠ 那个 Secret 对象不存在时，本 Pod 以 CreateContainerConfigError 起不来 —— 这跟
            # LLM_API_KEY 缺键时是同一条有意的 fail-closed：宁可拒启动，也不要「/health 全绿而
            # 登录面静默 503」那种假灯。⇒ apply 顺序必须先建 Secret、再 apply 20。
            # ⚠ 子目录 /run/app-secrets/jwt 不是多余一层：/run/app-secrets 已被 internal-hmac
            # 卷占住（而那个位置本身不能改回 /run/secrets，理由见上面的 kubelet 坑注）。
            - name: TENANT_JWT_PRIVATE_KEY_FILE
              value: /run/app-secrets/jwt/jwt.key
            - name: TENANT_JWT_PUBLIC_KEYS_FILE
              value: /run/app-secrets/jwt/jwt-pubs.json
            # 三个部署级开关从 CM 读（上面的成对理由与 D-f 写在那里，不在这里拄第二份）。
            - name: AUTH_TOKEN_TTL
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: AUTH_TOKEN_TTL
            - name: SIGNUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: SIGNUP_ENABLED
            - name: TENANT_JWT_KID
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: TENANT_JWT_KID
            # ---- 语义缓存（ADR-0013 C）：唯一后端 Valkey，禁止 CACHE_BACKEND=pg ----
            # VALKEY_URL 从 Secret 注入（可能含口令）；日志/health 统一脱敏。
            # 连接不可达时 fail-open（请求照常、health 报 degraded），不阻断平台启动。
            - name: CACHE_ENABLED
              value: "true"
            - name: CACHE_BACKEND
              value: "valkey"
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: VALKEY_URL
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: LLM_BASE_URL
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: LLM_MODEL
            - name: LLM_FALLBACK_MODEL
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: LLM_FALLBACK_MODEL
            # EMBEDDING_MODEL 只作用于 RemoteEmbedder 分支；本地模式的模型 id 由
            # INTENT_EMBEDDING_MODEL 决定（内核 get_embedder 的落底分支），两者别混。
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: EMBEDDING_MODEL
            - name: EMBEDDING_MODE
              value: "local"
            # 本地 bge-small-zh-v1.5 = 512 维，与 settings.vector_dim(512) 及 pgvector 列宽对齐；
            # 换 1024 维模型（如 bge-m3）会让新写入向量与既有列错位，必须连同维度一起改。
            - name: INTENT_EMBEDDING_MODEL
              value: "BAAI/bge-small-zh-v1.5"
            # 护栏：后端退化为 Mock（确定性 hash，检索失去语义）时直接失败，而非静默退化。
            - name: EMBEDDING_REQUIRE_REAL
              value: "true"
            # 离线加载：权重只在节点 hostPath 缓存里，禁止回连 huggingface.co。
            - name: HF_HOME
              value: "/opt/ap-models/hf-cache"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # ---- 输入护栏（PII 脱敏 + injection 拦截）----
            - name: GUARD_ENABLED
              value: "true"
            # 内核 input_guard 直接读 os.environ（默认已是 true，显式声明防被环境漂移改掉）。
            - name: GUARD_BLOCK_INJECTION
              value: "true"
            # ---- 可观测：线上已跑很久但清单从未声明这 4 键，一次 apply 即被抹掉 ----
            - name: OTEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: OTEL_ENABLED
            - name: OTEL_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: OTEL_EXPORTER
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: OTEL_SERVICE_NAME
            - name: OTEL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: OTEL_ENDPOINT
            # Langfuse 观测面（方案 docs/plans/plan-langfuse-wiring-2026-10-13.md）。
            # HOST 走 CM（非密钥，且必须与 OTEL_ENDPOINT 同一条"宿主 IP"链路——观测栈在
            # 126 的 moby 上，不在集群内）；两把项目凭据走 Secret，缺键即
            # CreateContainerConfigError fail-closed，与 LLM_API_KEY 同一口径。
            # 注意：三键齐 ≠ 接上了。包没装 / 栈没起时这里照样注入 ⇒ 判据见 §4 A3。
            - name: LANGFUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-platform-config
                  key: LANGFUSE_HOST
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: observability-keys
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: observability-keys
                  key: LANGFUSE_SECRET_KEY
          # compose TB-7：lifespan 内 init_pool 连不上 pg 会阻塞 ~30s
          # → startupProbe 给足 8*5s=40s 窗口，期间 readiness/liveness 不生效
          # 本地 embedding 在 lifespan 预热，重活不落进 /health 探测路径。
          # 预热耗时实测（2026-10-12 上线轮，CPU torch 镜像内、只读挂载）：权重加载 0.3s
          # （页缓存热）~10.2s（冷）；Pod 从创建到 Ready 15s ⇒ 40s 窗口有余。
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 8
            timeoutSeconds: 5
          # timeoutSeconds 显式化：API 默认 1s，而 /health 实测中位 0.8ms 只在空闲时成立——
          # CPU 推理持 GIL 时探测会被拖到秒级，1s 会连错 3 次把健康的 Pod 判死。
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              # 实测（2026-10-12 上线轮，LocalEmbedder 常驻、无并发查询时）：
              # cgroup memory.current=442Mi、kubectl top 441Mi、pid1 VmRSS=553Mi。
              # 1Gi = 该基线 + 一次批量 encode/上下文组装的余量，不是拍脑袋的上界。
              memory: 1Gi
            limits:
              cpu: "1"
              # 2Gi 为需求方拍板值（1Gi 装下本地语义模型后没有批量 encode 与碎片余量）。
              # cgroup memory.max 回读 2147483648 ⇒ 限额真生效（不是被裁剪掉的空话）。
              memory: 2Gi
          securityContext:
            runAsNonRoot: true   # 对应 Dockerfile 的非 root appuser(10001) 最佳实践
            runAsUser: 10001
          volumeMounts:
            # 只读挂载已证可行（2026-10-12，按 Pod 的真实运行条件跑：uid 10001 + :ro bind
            # + HF_HUB_OFFLINE=1）：加载成功 dim=512。huggingface_hub 会尝试往缓存写
            # trees/*.json 并报 `Permission denied`，但它自己降级为
            # "Ignoring corrupted tree cache file" 后照常加载 ⇒ 是噪声日志，不是失败。
            # 别把这条 readOnly 当"多余的谨慎"删掉：删了它，一次误写就会污染三个节点共用的权重缓存。
            - name: ap-models
              mountPath: /opt/ap-models
              readOnly: true
            - name: internal-hmac
              # 别把这里改成 /run/secrets：那个位置已被 kubelet 挂的 SA token 占用，只读 tmpfs 先占住后
              # runc 建子目录就是 EROFS，容器直接起不来（2026-10-28 在 126 实跑探针重现，理由详见 30 头部）。
              mountPath: /run/app-secrets
              readOnly: true
            - name: tenant-jwt
              # 登录面签名密钥：挂在 internal-hmac 那个卷的**子目录**里（kubelet 按路径深度排序，
              # 嵌套挂载成立）。与上面同一档 readOnly：签发侧只需要读，写不进去 = 少一条能在运行时
              # 换掉私钥的路径。env 里那两个路径必须与此处 mountPath + items[].path 逐字相同，
              # 那个同源关系由 tests/deploy/test_k8s_manifest_wiring.py 钉住（不靠人目测）。
              mountPath: /run/app-secrets/jwt
              readOnly: true
      volumes:
        # type: Directory = 节点上没这个目录就调度失败（Pod Pending + 明确事件），
        # 而不是静默起来、首次推理时才发现缓存不在本机、回连 huggingface.co 又不通。
        # 跨节点前提：缓存必须存在于 Pod 实际落到的节点（126 三节点各自的 /opt/ap-models 是独立盘）。
        - name: ap-models
          hostPath:
            path: /opt/ap-models
            type: Directory
        - name: internal-hmac
          secret:
            # 与 LLM_API_KEY/API_KEY/LANGFUSE_* 同住集群自有的 observability-keys（真实密钥永不入库，
            # 05-secrets.yaml 那份是 demo 值）。线上该对象当前没有这个键 ⇒ 上线前用
            # `kubectl patch secret observability-keys -p '{"stringData":{"INTERNAL_HMAC_KEY":"…"}}'`
            # **合并写**补键，不要用 apply（apply 是整对象替换，会抹掉已有键）。
            secretName: observability-keys
            # 只投这一个键：整对象挂进去会把 API_KEY/LANGFUSE_* 这些本进程不消费的凭据一起塞进 Pod。
            items:
              - key: INTERNAL_HMAC_KEY
                path: internal_hmac.key
            # 0440 + Pod fsGroup 10001：owner root、group 10001、其他进程不可读。
            defaultMode: 0440
        - name: tenant-jwt
          secret:
            # 为什么另建一个对象而不是塞进 observability-keys：轮换面不同轨。换签名密钥不应当
            # 有任何一次机会顺手覆盖到 LLM_API_KEY / LANGFUSE_*（补键走 kubectl patch 合并写，
            # apply 是整对象替换）；两个对象分放后，“patch 错对象”的影响面从「观测面与登录面一起挂」
            # 缩到只挂一边。名字由 tests/deploy 的集群自有清单登记（引用未交代的 Secret 对象即红）。
            secretName: agent-platform-jwt
            # 只投这两把：公钥 JSON 是 {kid: PEM} 形状（多枚并存才能轮转），私钥只有签发侧需要。
            items:
              - key: TENANT_JWT_PRIVATE_KEY
                path: jwt.key
              - key: TENANT_JWT_PUBLIC_KEYS
                path: jwt-pubs.json
            # 与 internal-hmac 同一档：0440 + fsGroup 10001（私钥对同 Pod 其他进程也不可读）。
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: agent-platform
  namespace: agent-platform
spec:
  # 2026-11-06 拍板：ClusterIP → NodePort（用户批准 A 档；属 D2 暴露面变更，依据写在下面）。
  # 为什么要改（两条实测 + 一条边界澄清，不是推定；2026-11-06 本段第 3) 条换形，成因见下面订正留痕）：
  #   1) ClusterIP 下唯一进入路径是 kubectl port-forward，而它是一条会断的流 —— 取证面两次记到
  #      它死掉（/tmp/portforward.log 末行 error: lost connection to pod）。于是「入口活不活」
  #      取决于某台宿主上有没有一个前台进程，而不是取决于服务本身。
  #   2) 集群底子：kubectl get ingressclass = No resources found、ingress/traefik/nginx controller
  #      pod = 0、全集群 NodePort svc = 0 ⇒ 要常驻，NodePort 是本集群代价最小的一项，本 Service 是头一个。
  #   3) 边界澄清（它不是本段改型的依据）：可达性由 Service 类型支配，与 dist 住在哪个容器无关 ⇒ 前端拆不拆
  #      独立 Pod 都不改变本段结论。那个形态决策的真相源在 docs/adr/0010-ui-stack-selection.md §7.1
  #      （现态：同镜像同 Pod，由 NoStoreStaticFiles 挂 /ui），清单注释不承载形态决策。
  #      订正留痕：本条原写「拆独立前端 Pod 改变不了...（同一读数的推导见台账 §43）」—— 那个锚是假的，
  #      台账 §43 不含任何拆分推导（2026-11-06 对该节全文检索零命中）；维度拆分与错锚定性见 ADR §7.2。
  # 暴露了什么：同一次 apply 一起可达的还有 /docs、/openapi.json、/health —— 那不是新东西，
  # 它们在 ClusterIP 期已经经 ops 通道可达；真正变的是「节点 IP 也能到」这一层。
  # 鉴权实测（改前现取，非引用旧快照）：DEPLOY_ENFORCE_IDENTITY=true、SINGLE_TENANT=default、
  # API_KEY_len=32；POST /query 无 key → 401、带假 key → 401 ⇒ 开放的是需要凭据的入口，不是匿名读写。
  # 为什么钉 30080 而不让集群分配：入口地址要能写进手册给人点，随机端口等于没有地址。
  # 为什么不指某台节点：Pod 会随调度飘（实测落在 <internal-host>），NodePort 三台都通 ⇒ 用任一 <internal-ip>:30080。
  type: NodePort
  selector:
    app: agent-platform
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080   # 固定值：apply 前须现取「该口三台宿主均未监听」+「集群内无同名 nodePort 冲突」
---
# （可选加分项）HPA：先 minikube addons enable metrics-server 再启用本块
# apiVersion: autoscaling/v2
# kind: HorizontalPodAutoscaler
# metadata:
#   name: agent-platform-hpa
#   namespace: agent-platform
# spec:
#   scaleTargetRef:
#     apiVersion: apps/v1
#     kind: Deployment
#     name: agent-platform
#   minReplicas: 1
#   maxReplicas: 3
#   metrics:
#     - type: Resource
#       resource:
#         name: cpu
#         target:
#           type: Utilization
#           averageUtilization: 70
