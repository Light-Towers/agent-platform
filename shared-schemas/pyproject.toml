[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-schemas"
version = "0.1.0"
description = "统一 Pydantic schema，deepagents 联邦网关 4 服务共享"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared_schemas"]
