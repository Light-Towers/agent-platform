[project]
name = "kefu-service"
version = "0.1.0"
description = "kefu 客服迁移版（deepagents + LangGraph，Agent Protocol 兼容，Phase 7）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "shared-schemas",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "langgraph>=1.2.10",
    "pydantic>=2.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-core = { path = "../agent-core", editable = true }
shared-schemas = { path = "../shared-schemas", editable = true }
