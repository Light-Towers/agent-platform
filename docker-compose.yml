services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_platform_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 默认不对外发布 5432；本地调试可取消下一行注释（仅回环）
    # ports: ["127.0.0.1:5432:5432"]

  agent-platform:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # TB-7：容器就绪探针。lifespan 内 init_pool(wait=True) 若连不上 pg 会阻塞 ~30s，
    # 仅靠 depends_on 无法判断 api 自身是否真 ready，故加 healthcheck 让 compose 冒烟可判定。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s
    environment:
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD:-agent_platform_dev}@postgres:5432/agent_platform
      API_KEY: ${API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-zh}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SQL_DSN: ${SQL_DSN:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    ports:
      # 只绑定回环地址，避免 0.0.0.0 直接暴露（compose 安全面规约）
      # 宿主端口参数化（默认 8000），便于本机 8000 被占用时冒烟切换，如 HOST_PORT=18000 make compose-smoke
      - "127.0.0.1:${HOST_PORT:-8000}:8000"

volumes:
  pgdata: {}
