[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-service"
version = "1.1.0"
description = "掌柜智库：RAG 知识库导入与多路检索问答一体化服务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "掌柜智库 Team" }]
keywords = ["rag", "langgraph", "fastapi", "milvus", "knowledge-base"]
# 版本下界 = monorepo 根 uv.lock 当前锁定版本（2026-09-22 T1.1 提取），
# 防止全新环境装到不兼容旧版；升级须同步评估 uv.lock。
dependencies = [
    "fastapi>=0.141.1",
    "flagembedding>=1.4.0",
    "grandalf>=0.8",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.10,<2",
    "loguru>=0.7.3",
    "magic-pdf>=0.6.1",
    "minio>=7.2.20",
    "modelscope>=1.39.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pymilvus[model]>=3.0.1",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "regex>=2026.7.19",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.4",
    "transformers>=5.15.0",
    "openai-agents>=0.21.1",
    "requests>=2.34.2",
    # agent-core 共享内核（monorepo sibling 包，editable 安装，import 名 agent_core）。
    # uv 语法（推荐，本仓含 uv.lock）。pip 用户需改为：`pip install -e ../agent-core`，
    # 并在 requirements 去掉此行（setuptools 不解析 path 表）。
    "agent-core",
    "shared-schemas",
]

[project.scripts]
knowledge-service = "knowledge_service.main:run"

[project.urls]
Homepage = "https://github.com/Light-Towers/agent-platform"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_service*"]

# ---------------------------------------------------------------------------
# ruff：静态检查与格式化基线（M1 引入，M3 收窄）
#
# 说明：本项目存量代码已有部分历史债。M1 的目标是
# 「让 CI 门禁可用且结果可复现」，M3 完成全量整形并收窄豁免：
#   - lint 规则集固定为 pyflakes(F) + pycodestyle 的错误类子集(E4/E7/E9)；
#   - M3 已执行 `ruff format knowledge_service tests eval` 全量整形，`ruff format --check`
#     翻转为 CI 硬门禁（zhiku-ci.yml 不再 continue-on-error）；
#   - M3 通过自动修复消除 F401（unused-import，18 处）与 F541（f-string 无占位符，
#     6 处），二者已从 ignore 移除；剩余 ignore 为**非自动修复**存量告警
#     （26 处 = E722 1 + F403 6 + F405 18 + F811 1），作为待收窄基线，
#     新代码不得再引入清单外的新告警。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "doc",
    "logs",
    "output",
    "prompts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# 存量基线（M3 收窄后剩余非自动修复项），后续里程碑按目录逐条收窄；新增代码请勿依赖这些豁免。
ignore = [
    "E722", # bare-except：存量 1 处（node_rrf.py:39）
    "F403", # star import：存量 6 处（query_router 2 / node_rerank 1 / node_search_embedding_hyde 3）
    "F405", # star import 派生的未定义名：存量 18 处
    "F811", # 重复定义：存量 1 处（knowledge_service/core/logger.py:95）
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
