[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exhibition-agent"
version = "0.1.0"
description = "会展行业 AI Agent（平台侧骨架；按跨项目接口契约 v1.1 接入 mingyang-warehouse）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "langgraph>=1.2.10,<2",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["exhibition_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["B008", "E402", "E731"]
