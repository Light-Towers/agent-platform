[project]
name = "kefu-service"
version = "0.1.0"
description = "kefu 客服迁移版（deepagents + LangGraph，Agent Protocol 兼容，Phase 7）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # 统一意图架构 agent_core.intent 的可选本地嵌入能力（L1）声明为 extra：
    # 安装该 extra 后 classify_intent 可走 sentence-transformers 主路径；
    # 未安装时 classify_intent 自动降级，intent_node 回退业务关键词分流（可达性底线，#1）。
    "agent-core[memory-embed-local]",
    "shared-schemas",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "langgraph>=1.2.10,<2",
    "pydantic>=2.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["kefu_agent"]
