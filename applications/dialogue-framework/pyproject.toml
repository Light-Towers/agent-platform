[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialogue-framework"
version = "0.1.0"
description = "LLM 驱动的对话系统框架基础设施（迁移自 kefu 老系统 legacy）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "shared-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2.10,<2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "sqlglot>=23.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
huggingface = [
    "langchain-huggingface>=0.1",
]

[project.scripts]
dialogue-framework = "dialogue_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dialogue_framework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
