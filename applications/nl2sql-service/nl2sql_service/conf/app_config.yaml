# nl2sql-service 应用配置
server:
  host: "0.0.0.0"
  port: 8000

llm:
  model: "gpt-4o-mini"
  timeout: 60.0
  max_retries: 3

embedding:
  backend: "langchain_openai"
  model: "text-embedding-3-small"
  vector_dim: 1536

retrieval:
  top_k: 10
  rrf_k: 60
  # 向量召回相对截断（P0-5④）：与最佳分的差超过 margin 即截断；0 = 关闭
  score_margin: 0.15

sql:
  read_only_guard: true
  max_rows: 1000
  max_correct_retries: 3
  # 进模型的结果体量上限（§5.11-V3 双上限）：与 max_rows（返回 UI）分开
  max_rows_for_prompt: 100
  prompt_max_bytes: 51200
  # 候选表行数估值超过该值时，生成 prompt 追加"优先聚合"引导（估值来自 P0-3 漂移检测）
  aggregation_row_threshold: 1000000

# 连接池配额与语句超时（psycopg_pool；2026-10-18 起建池走共享件 agent_runtime.pool_factory，
# 配额口径见方案 §5.12.2）
# meta：检索 + CRUD 共用，毫秒级画像；dw：执行 LLM 生成的 SQL，OLAP 长查询画像
pool:
  meta:
    min_size: 1
    max_size: 20
    timeout: 5.0
    statement_timeout_ms: 5000
  dw:
    min_size: 1
    max_size: 10
    timeout: 10.0
    statement_timeout_ms: 30000

tokenizer:
  type: "bigram"

# 数据源（P1-3/P1-4/P1-6）：问数只读消费方，源由用户在会话里显式选定。
# 单源部署（一个 dw DSN）时描述默认源；dialect 留空按 dw DSN scheme 自动探测。
datasource:
  id: "dw"
  label: ""            # 口径标签（P1-3②），随响应体返回，如"数仓 T+1、已清洗"
  dialect: ""          # 空 = 按 dw_db_dsn scheme 探测；否则 postgres | mysql

# 负载隔离（P1-5/S-6）：应用侧并发闸 + 限流，全 0 = 关闭（Doris workload group
# 管不到应用层这条）。max_concurrency 超限排队、acquire_timeout 超时拒绝。
load_guard:
  max_concurrency: 0
  rate_limit_per_min: 0
  acquire_timeout: 5.0
