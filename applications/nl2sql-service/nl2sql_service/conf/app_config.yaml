# nl2sql-service 应用配置
server:
  host: "0.0.0.0"
  port: 8000

llm:
  model: "gpt-4o-mini"
  timeout: 60.0
  max_retries: 3

embedding:
  backend: "langchain_openai"
  model: "text-embedding-3-small"
  vector_dim: 1536

retrieval:
  top_k: 10
  rrf_k: 60

sql:
  read_only_guard: true
  max_rows: 1000
  max_correct_retries: 3

# 连接池配额与语句超时（psycopg_pool；2026-10-18 起建池走共享件 agent_runtime.pool_factory，
# 配额口径见方案 §5.12.2）
# meta：检索 + CRUD 共用，毫秒级画像；dw：执行 LLM 生成的 SQL，OLAP 长查询画像
pool:
  meta:
    min_size: 1
    max_size: 20
    timeout: 5.0
    # 15s（#106，原 5s）：DDL 承诺 ANN 缺失时降级顺序扫描仍可工作；仍显著低于 dw 的
    # 30s（meta 交互级 / dw OLAP 分层，test_pool_factory 钉死 dw > meta）
    statement_timeout_ms: 15000
  dw:
    min_size: 1
    max_size: 10
    timeout: 10.0
    statement_timeout_ms: 30000

tokenizer:
  type: "bigram"
