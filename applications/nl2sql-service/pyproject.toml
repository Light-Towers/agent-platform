[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl2sql-service"
version = "0.1.0"
description = "通用 Text-to-SQL 数据分析服务（12 节点 LangGraph 管线，元知识参数化）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    # 身份门卫装配点（roadmap #11）：IdentityMiddleware 在 agent-runtime，
    # PyJWT 走其 [identity] extra（惰性导入：只有真收到令牌才 import）。
    "agent-runtime[identity]",
    "shared-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.10,<2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "psycopg[binary,pool]>=3.3.6",
    "pgvector>=0.3",
    "sqlglot>=25.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
huggingface = [
    "langchain-huggingface>=0.1",
]
# TOKENIZER=jieba 时才需要；缺包会告警并降级 bigram
tokenizer = [
    "jieba>=0.42",
]

[project.scripts]
# Q26②：指向 API server 入口。此前指向空壳构建 CLI，装完包按命令名启动
# 得到空转脚本；构建 CLI 仍走 python -m nl2sql_service.scripts.build_meta_knowledge。
nl2sql-service = "nl2sql_service.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nl2sql_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
