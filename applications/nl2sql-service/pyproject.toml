[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl2sql-service"
version = "0.1.0"
description = "通用 Text-to-SQL 数据分析服务（12 节点 LangGraph 管线，元知识参数化）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "shared-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2.10,<2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "sqlglot>=25.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
huggingface = [
    "langchain-huggingface>=0.1",
]

[project.scripts]
nl2sql-service = "nl2sql_service.scripts.build_meta_knowledge:main"

[tool.hatch.build.targets.wheel]
packages = ["nl2sql_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
