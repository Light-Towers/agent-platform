<!doctype html>
<!-- ==========================================================================
 * index.html — Vite 入口壳（构建后由 agent_server 挂在 /ui 下）
 * 三条刻意的"不做"，都是已定案而不是遗漏：
 *   ① 原定「不写内联脚本」已于 2026-11-23 由用户拍板翻转（方案 D-2）：首帧闪白
 *      是可见缺陷，故在 <head> 顶部加一段同步脚本，在首帧前把**手动**主题偏好落到
 *      <html>。只写 light/dark 两档；system 与缺省不写属性，交给媒体查询——
 *      写 data-theme="auto" 会让整条媒体查询失配。旧取舍见视觉件 §1.5 与其历史注。
 *   ② 不在这里放 no-store 的 meta。§2.3 要的 `Cache-Control: no-store` 是**响应头**，
 *      由服务端 NoStoreStaticFiles 覆写（工单件 §9.1 第 3 条）；meta 等价物既不被
 *      所有浏览器遵守，也会让"谁负责这个头"变得看不出来。
 *   ③ `<html>` 上不带 data-theme 默认值。视觉件 §1.5 的主题机制是「:root = light，
 *      系统深色经 prefers-color-scheme 生效，手动切换才写 data-theme」——默认写死
 *      一个值会让"跟随系统"这条档在物理上不存在。① 的脚本同样遵守这一条。
 * ========================================================================-->
<html lang="zh-CN">
  <head>
    <script>
      (() => {
        let saved = null
        try { saved = localStorage.getItem('ap.ui.theme') } catch { /* 存储禁用 ⇒ 按跟随系统 */ }
        // 与 theme.ts 同一 key、同一属性名、同一档位语义：
        // 手动档写属性；system/无值不写，交 @media (prefers-color-scheme: dark)。
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Platform 控制台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
