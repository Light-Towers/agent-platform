[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent 运行时中间件层（Plan-F）：admission/coordinator/session/checkpoint/tracing/cache/rate_limit/circuit_breaker/mcp"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "shared-schemas",
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
