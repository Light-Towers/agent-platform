[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent 运行时中间件层（Plan-F）：admission/coordinator/session/checkpoint/tracing/cache/rate_limit/circuit_breaker/mcp"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "shared-schemas",
    "pydantic>=2.13",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0"]  # Dependabot: MCP SDK 多 high 告警（first_patched 1.28.1）

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]

# ---------------------------------------------------------------------------
# ruff / pytest 显式配置（F-S0-10，2026-09-21）：固化门禁规则集，避免依赖根
# pyproject.toml 配置静默漂移。规则集与根配置保持一致。
# 注意：pytest 配置块一旦存在，本目录 pytest session 的 inifile 即为本文件，
# 根配置（asyncio_mode/importlib addopts）不再继承，故必须在此显式声明，
# 否则 62 条测试中大量 async def test_ 将因 asyncio_mode 回落 strict 而失败。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE001/S110：P0-4 盲捕获门禁（2026-09-24）——内核运行时已启用；legacy 存量入下方基线，只减不增。
select = ["E4", "E7", "E9", "F", "I", "BLE001", "S110"]
# 存量豁免基线（与根 pyproject.toml 对齐，配置化前靠继承根 ignore 生效，F-S0-10 显式固化）：
# E402: admission_gateway.py 模块级 import 在 logger 定义后（deliberate 顺序）；
# E731: skills/registry.py 中间件链 lambda 闭包（风格，非逻辑阻断）。
ignore = ["E402", "E731"]

# P0-4 盲捕获门禁棘轮基线：逐文件锁定 legacy 存量，新代码不得新增；策略为整包基线豁免（源码不写逐点 noqa）。
# 进度见 docs/plans/plan-p0-4-blind-except-ratchet-2026-09-24.md。
[tool.ruff.lint.per-file-ignores]
"agent_runtime/admission_gateway.py" = ["BLE001", "S110"]
"agent_runtime/circuit_breaker.py" = ["BLE001"]
"agent_runtime/context/compact.py" = ["BLE001"]
"agent_runtime/control_plane.py" = ["BLE001", "S110"]
"agent_runtime/db.py" = ["BLE001", "S110"]
"agent_runtime/otel.py" = ["BLE001"]
"agent_runtime/planner/agentic.py" = ["BLE001"]
"agent_runtime/planner/execution_graph.py" = ["BLE001"]
"agent_runtime/planner/graph_compose.py" = ["BLE001"]
"agent_runtime/planner/protocol.py" = ["BLE001", "S110"]
"agent_runtime/sandbox.py" = ["BLE001"]
"agent_runtime/tracing.py" = ["BLE001"]
"agent_runtime/trajectory/replay.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
