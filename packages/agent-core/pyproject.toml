[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.1.0"
description = "Framework-agnostic agent runtime kernel: tracing, guardrails, eval metrics, llm client, memory, tool registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agent", "tracing", "guardrails", "rag", "llm"]
# 核心层仅依赖 stdlib + 自带 agent_core.logging，无第三方硬依赖。
dependencies = []

[project.urls]
Homepage = "https://github.com/Light-Towers/agent-platform"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

# ---------------------------------------------------------------------------
# 可选依赖（extra）：重型/可选依赖全部降级为 extra + 懒导入，
# 使纯模块（tracing / metrics / guardrails 纯逻辑 / llm 协议层 / memory.base /
# tools.base）在仅装 stdlib 的 venv 即可 import。
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# OTel 全链路追踪
tracing = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
# LLM openai 兼容适配器（langchain-openai）。核心协议层不需要。
llm-openai = [
    "langchain-openai",
]
# ASGI 安全护栏中间件
web = [
    "starlette",
]
# Mongo 历史记忆实现（MongoHistoryStore + MongoCheckpointer）
memory-mongo = [
    "pymongo",
]
# Milvus 语义记忆后端（默认向量后端）
memory-milvus = [
    "pymilvus>=2.4",
]
# PostgreSQL + pgvector 语义记忆备选后端
memory-pgvector = [
    "asyncpg>=0.29",
]
# Embedding 本地模型（sentence-transformers，本地 bge-small-zh）
memory-embed-local = [
    "sentence-transformers>=2.3",
]
# 记忆全家桶（按需安装，代码内均懒加载 + 软降级）
memory = [
    "pymongo",
    "pymilvus>=2.4",
    "asyncpg>=0.29",
    "sentence-transformers>=2.3",
]
# MCP 工具适配器
tools-mcp = [
    "openai-agents",
]
# SQL 白名单守卫
sql = [
    "sqlglot>=25.0",
]
# LangChain 兼容适配（BaseChatModel 子类）。供 deepagents 等需要
# isinstance(BaseChatModel) 检查的框架薄适配；核心降级逻辑仍在 fallback.py。
langchain = [
    "langchain-core",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "tests"]

[tool.ruff.lint]
# I(isort)：2026-09-21 F-S0-07 与根配置对齐（存量 10 处 I001 已 --fix 收敛，新代码不得再引入未排序 import）。
# BLE001/S110：P0-4 盲捕获门禁（2026-09-24）——内核包最高优先，已启用；legacy 存量入下方基线，只减不增。
select = ["E4", "E7", "E9", "F", "I", "BLE001", "S110"]
ignore = [
    "E722",
    "F403",
    "F405",
    "F811",
]

# P0-4 盲捕获门禁棘轮基线：逐文件锁定 legacy 存量，新代码不得新增；策略为整包基线豁免（源码不写逐点 noqa）。
# 进度见 docs/plans/plan-p0-4-blind-except-ratchet-2026-09-24.md。
[tool.ruff.lint.per-file-ignores]
"agent_core/events.py" = ["BLE001"]
"agent_core/intent/classifier.py" = ["BLE001", "S110"]
"agent_core/intent/llm_judge.py" = ["BLE001"]
"agent_core/llm/fallback.py" = ["BLE001"]
"agent_core/memory/__init__.py" = ["BLE001"]
"agent_core/memory/embedder.py" = ["BLE001", "S110"]
"agent_core/memory/mongo.py" = ["BLE001"]
"agent_core/memory/semantic.py" = ["BLE001"]
"agent_core/memory/store.py" = ["BLE001"]
"agent_core/memory/vector_backend.py" = ["BLE001", "S110"]
"agent_core/monitor.py" = ["BLE001"]
"agent_core/tokenizer.py" = ["BLE001"]
"agent_core/tools/adapters/mcp.py" = ["BLE001", "S110"]
"agent_core/tools/guarded.py" = ["BLE001", "S110"]
"agent_core/tracing.py" = ["BLE001", "S110"]
"agent_core/tracing_propagation.py" = ["BLE001"]
