[project]
name = "agent-platform"
version = "0.1.0"
description = "统一生产级 Agent 平台：Supervisor + Search/RAG/Text-to-SQL 子图（LangGraph 单进程多子图架构）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Light-Towers" }]
dependencies = [
    "agent-core",
    "shared-schemas",
    "agent-runtime",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "langgraph>=1.2.12,<2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pgvector>=0.3",
    "asyncpg>=0.29",
    "rank-bm25>=0.2.2",
    "sqlglot>=30.20.0",
    "anyio>=4.15.1",  # Dependabot: AnyIO TLSStream IDNA 2003 / process-pool 阻塞（critical+medium，first_patched 4.14.2；现下界已高于修复版）
]

[project.optional-dependencies]
pdf = ["pypdf>=6.19.0"]
otel = [
    # 下界与 agent-core [tracing] 归一（lint L-4 防漂移，方案 §3.3；agent-runtime [otel]
    # 声明位已随 2026-09-30 门面退役摘除）；
    # api 显式声明：propagator/attach 属 API 层能力，不应依赖 sdk 传递边隐性带入。
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]
mcp = ["mcp>=2.2.0"]  # Dependabot: MCP SDK DNS 重绑定/WebSocket/HTTP session（high×3，first_patched 1.28.1；现下界已高于修复版）
# Agentic Planner 模式（PLANNER=agentic）需要联邦侧 AgenticPlanner；
# 默认 deterministic/graph/auto 模式无需安装。安装：uv sync --extra agentic
agentic = ["agent-federation-app"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.9",
]

# 检索回归评测专用（FlashRAG 依赖较重：faiss/transformers/spacy 等），
# 不进 dev，避免拖垮日常 `make install`。跑评测用 `make eval-rag`（自动 --extra eval）。
eval = [
    "flashrag-dev",
    "faiss-cpu",
    "transformers>=5.17.0",  # Dependabot: transformers 多条 RCE/路径遍历（high×3+medium×1，first_patched 5.10.0；现下界已高于修复版），强制下界覆盖 flashrag-dev 传递边
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applications/agent_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "packages/agent-core/tests",
]
markers = [
    "requires_pg: 需要真实 PostgreSQL 的 HA 测试（lease/checkpoint/side_effects 持久化）。归属 agent-platform-ha workflow（-m requires_pg + 真实 PG service；CI=true 下环境不满足即 FAIL）。普通 `make test` 根套件以 -m 'not requires_pg' 排除，本地无 PG 开发机自动 skip。",
]
# 注：agent_federation/tests/unit 与 kefu-service/tests 经 Makefile `test` 目标以
# 独立 pytest session 纳入 CI（避免与根 tests/ 的 conftest 插件名冲突）。
# 分层（2026-08-19）：packages/ 放平台库（agent-core/agent-runtime/shared-schemas），
# applications/ 放应用（agent_server/agent_federation/kefu-service/
# nl2sql-service/knowledge-service）。原 deepagents/ 因与 PyPI 包同名已重命名为
# agent_federation/ 并清理残骸。根宿主原 app/ 已改名 agent_server/（包名同步）。
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 显式 select，固化 lint 门禁规则集，避免依赖 ruff 默认 select（E4,E7,E9,F）漂移导致 I(isort) 等规则被静默关闭。
select = ["E4", "E7", "E9", "F", "I", "BLE001", "S110"]
# 以下为既有风格/惯例类告警，非逻辑阻断；收敛以让 CI 门禁（ruff check .）转绿。
# B008: FastAPI 在依赖注入（Depends(...)）中于函数默认参数位置调用是官方推荐写法，非真实 bug。
# E402: 模块级 import 不在顶部（agent_federation 多因 load_dotenv()/sys.path 后再 import，deliberate）。
# E731: lambda 赋值（风格）。B017: pytest.raises(Exception)。
# PERF102: .items()→.values()。RUF059: 未使用解包变量。
# 注：BLE001/S110 已于 P0-4（2026-09-24）从 ignore 移除并纳入 select（根长尾的 legacy 入下方基线）。
ignore = ["B008", "E402", "E731", "B017", "PERF102", "RUF059"]

# P0-4 盲捕获门禁棘轮基线（根配置仅覆盖无独立 [tool.ruff] 的子树：agent_server / kefu / nl2sql / eval / scripts / tests）。
# 逐文件锁定 legacy 存量，新代码不得新增；烧净一个删一行。进度见 docs/plans/plan-p0-4-blind-except-ratchet-2026-09-24.md。
[tool.ruff.lint.per-file-ignores]
"applications/agent_server/agent/router.py" = ["BLE001"]
"applications/agent_server/memory/thread_persist.py" = ["BLE001"]
"applications/agent_server/rag/store.py" = ["BLE001"]
"applications/agent_server/sql/pipeline.py" = ["BLE001"]
"applications/kefu-service/kefu_agent/graph.py" = ["BLE001"]
"applications/nl2sql-service/nl2sql_service/agent/nodes/recall_column.py" = ["BLE001"]
"applications/nl2sql-service/nl2sql_service/agent/nodes/recall_metric.py" = ["BLE001"]
"eval/memory_reuse_llm.py" = ["BLE001"]
"scripts/check_doc_sync.py" = ["BLE001"]
"scripts/lint_architecture.py" = ["BLE001", "S110"]
"scripts/smoke_memory.py" = ["BLE001"]
"tests/ha/conftest.py" = ["BLE001"]

[tool.uv.sources]
agent-core = { workspace = true }
shared-schemas = { workspace = true }
agent-runtime = { workspace = true }
agent-federation-app = { workspace = true }
flashrag-dev = { git = "https://github.com/RUC-NLPIR/FlashRAG.git" }

[tool.uv.workspace]
# 注：根项目本体（applications/agent_server，原 app/）不是独立 workspace 成员，
# 它是 agent-platform 根包的源码（由 [tool.hatch.build.targets.wheel] packages 指定）。
# 以下为真正的独立成员（各自含 pyproject.toml，被根项目/彼此以 workspace=true 依赖引用）。
members = [
    "packages/agent-core",
    "packages/shared-schemas",
    "packages/agent-runtime",
    "applications/agent_federation",
    "applications/kefu-service",
    "applications/nl2sql-service",
    "applications/knowledge-service",
    "applications/exhibition-agent",
]

[tool.uv]
# Windows 本机修复（2026-09-25）：pyarrow 24.0.0 在 Windows 上与
# jwt→cryptography(rust) + sentence_transformers 依赖链（torch/datasets 等几十个
# 原生扩展）同进程导入时，pyarrow 原生模块加载 access violation（确定性 segfault，
# pyarrow 25.0.1 已修复）。resolver 出于未知原因拒绝升到 25，用约束下限强制。
# Linux CI 不受 24 影响，升到 25 属常规 minor 升级。
# Dependabot 重扫新暴露（2026-09-30 二轮，方案 §11）：PyJWT 2.13.0 命中 10 个 advisory
# （critical×1 / high×5 / medium×4），first_patched 全部为 2.14.0，属「有补丁版本」的常规可修项。
# lock 内唯一第三方引入者是 mcp 2.0.0（要求 pyjwt[crypto]>=2.10.1，无上限），根包 identity extra
# 要求 >=2.9 亦无上限 → 加下限约束不违反任何上游契约，且 pyjwt 自身只依赖已在位的 cryptography，
# 不引入新包。用 constraint（收紧版本下限）而非 override（摘边），因为这里要的是升级不是剔除。
constraint-dependencies = ["pyarrow>=25.0.1", "pyjwt>=2.14.0"]
# Dependabot R 系列收口（2026-09-30，方案 docs/plans/plan-dependabot-21-alerts-closure-2026-09-30.md）：
# fschat 0.2.36（6 告警）+ nltk 3.10.3（1 告警）上游**无修复版本**（NLTK advisory 原文
# “Patched versions: Not yet patched”，FastChat 仓库已归档），升版无法解决。
# 两者唯一引入者是 flashrag-dev（仅根 eval extra），且经源码核实：本仓评测入口只 import
# flashrag.config / dataset / evaluator，其 import 闭包为 rouge / rouge_chinese / jieba /
# transformers / tiktoken，**不触及 fschat（只在 FlashRAG webui）与 nltk（只在 FlashRAG refiner）**；
# rouge / rouge-chinese 仅依赖 six，spacy/bm25s/chonkie 均不依赖 nltk —— 故摘除两条边不破坏其它已锁包。
# 手法：uv 官方的「假 marker 移除传递依赖」——本仓 requires-python >= 3.11，该 marker 恒假，解析器丢弃该边。
# 副作用：若后续要跑 FlashRAG webui（streamlit）或 refiner（LLMLingua），需先移除本 override。
override-dependencies = ["fschat ; python_version < '3.9'", "nltk ; python_version < '3.9'"]
