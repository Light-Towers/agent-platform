[project]
name = "agent-platform"
version = "0.1.0"
description = "统一生产级 Agent 平台：Supervisor + Search/RAG/Text-to-SQL 子图（LangGraph 单进程多子图架构）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Light-Towers" }]
dependencies = [
    "agent-core",
    "shared-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "langgraph>=1.2.10,<2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "asyncpg>=0.29",
    "rank-bm25>=0.2.2",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
mcp = ["mcp>=0.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# 检索回归评测专用（FlashRAG 依赖较重：faiss/transformers/spacy 等），
# 不进 dev，避免拖垮日常 `make install`。跑评测用 `make eval-rag`（自动 --extra eval）。
eval = [
    "flashrag-dev",
    "faiss-cpu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "agent-core/tests",
]
# 注：deepagents/tests/unit 与 kefu-service/tests 经 Makefile `test` 目标以
# 独立 pytest session 纳入 CI（避免与根 tests/ 的 conftest 插件名冲突）。
# test_tool_registry 为预存导入冲突（本地 deepagents/ 目录遮蔽 PyPI deepagents 包），
# 已在对应 session 中 --ignore，待独立修复后再放开。
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 显式 select，固化 lint 门禁规则集，避免依赖 ruff 默认 select（E4,E7,E9,F）漂移导致 I(isort) 等规则被静默关闭。
select = ["E4", "E7", "E9", "F", "I"]
# 以下为既有风格/惯例类告警，非逻辑阻断；收敛以让 CI 门禁（ruff check .）转绿。
# B008: FastAPI 在依赖注入（Depends(...)）中于函数默认参数位置调用是官方推荐写法，非真实 bug。
# E402: 模块级 import 不在顶部（deepagents 多因 load_dotenv()/sys.path 后再 import，deliberate）。
# E731: lambda 赋值（风格）。BLE001/S110: 盲捕获（既有合理降级）。B017: pytest.raises(Exception)。
# PERF102: .items()→.values()。RUF059: 未使用解包变量。
ignore = ["B008", "E402", "E731", "BLE001", "S110", "B017", "PERF102", "RUF059"]

[tool.uv.sources]
agent-core = { workspace = true }
shared-schemas = { workspace = true }
flashrag-dev = { git = "https://github.com/RUC-NLPIR/FlashRAG.git" }

[tool.uv.workspace]
members = [
    "agent-core",
    "shared-schemas",
    "deepagents",
    "kefu-service",
    "wenda-data-agent",
    "zhanggui-zhiku",
    "dialogue-framework",
]
