[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-app"
version = "2.0.0"
description = "Production-grade multi-agent orchestration: supervisor + 3 sub-agents (Tavily/MySQL/zhiku), sharing agent-core kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Light-Towers" }]
keywords = ["agent", "multi-agent", "orchestration", "langgraph", "fastapi"]
dependencies = [
    "agent-core",
    "deepagents==0.7.5",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4",
    "langgraph>=1.2.10",
    "langgraph-checkpoint>=4.2.0",
    "fastapi>=0.129",
    "uvicorn>=0.41",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.46",
    "tavily-python>=0.7",
    "tenacity>=9.1",
    "sqlparse>=0.5",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "requests>=2.34.2",
    "ragflow-sdk>=0.22.1",
    "numpy>=2.0.0",
    "python-multipart>=0.0.9",  # 上传端点 UploadFile/File/Form 运行所需（fastapi 非硬传递）
]

[project.optional-dependencies]
# 以下为代码内 try/except ImportError 软降级的「可选能力」，按需安装：
# pip install -e "./deepagents[observability,cache,docs,excel]"
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# 链路追踪（langfuse_adapter 软降级，无 SDK 时 no-op）
observability = ["langfuse>=4.0.0"]
# 语义缓存（layers 软降级，无 valkey 时 no-op）
cache = ["valkey>=0.1.0"]
# Markdown→PDF 文档生成（word_converter 软降级）
docs = ["markdown>=3.10.2", "weasyprint>=69.0", "pypdf>=4.0"]
# Excel/Word 文件读取（upload_file_read_tool 软降级）
excel = ["pandas>=3.0.1", "openpyxl>=3.1.5", "python-docx>=1.2.0"]

[tool.uv.sources]
agent-core = { path = "../agent-core", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "tools*", "utils*", "prompt*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E402: 模块级 import 不在顶部（多因 load_dotenv()/sys.path 后再 import，deliberate）。
# E731: lambda 赋值（风格）。两者非逻辑阻断，忽略以让 CI 门禁转绿。
ignore = ["E402", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
