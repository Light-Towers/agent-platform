[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wenda-adapter"
version = "0.1.0"
description = "wenda SSE→JSON 适配层"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-core",
    "shared-schemas",
    "fastapi>=0.129",
    "uvicorn>=0.41",
    "httpx>=0.28",
    "pydantic>=2.13",
]

[tool.hatch.build.targets.wheel]
include = ["main.py"]

[tool.uv.sources]
agent-core = { path = "../agent-core", editable = true }
shared-schemas = { path = "../shared-schemas", editable = true }
